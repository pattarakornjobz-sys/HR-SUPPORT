<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Desk</title>
<meta name="description" content="ระบบมอบหมายและติดตามงาน สำนักงานสนับสนุนมูลนิธิและโครงการ">
<meta name="theme-color" content="#0d1130">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Team Desk">
<script>(function(){var t='';try{t=localStorage.getItem('td_theme')||'';}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== Design tokens · สว่าง ===================== */
:root{color-scheme:light;
--bg:#f3f5fc;--surface:#ffffff;--surface-2:#f6f7fd;--surface-3:#eceffa;--ink:#141933;--muted:#646b88;--line:#e3e6f2;--line2:#eef0f8;
--pri:#5b5bf6;--pri-d:#4338ca;--pri-t:#eceeff;--pri-ink:#3d3ad6;--accent:#0ea5b7;
--grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 52%,#d946ef 100%);--grad-soft:linear-gradient(135deg,rgba(99,102,241,.12),rgba(217,70,239,.10));
--todo:#64708a;--todo-t:#eef1f7;--doing:#2563eb;--doing-t:#e6eeff;--review:#c2700b;--review-t:#fff3df;--sign:#7c3aed;--sign-t:#f1e9ff;--done:#059669;--done-t:#e1f7ee;--cancel:#8b90a0;--cancel-t:#f0f1f5;
--bad:#e11d48;--bad-t:#ffe8ee;--warn:#d97706;--warn-t:#fff3df;
--a-t:#fff4df;--a-ink:#b06a00;--b-t:#e8efff;--b-ink:#2d5bd6;--c-t:#dff7ec;--c-ink:#04875a;
--ext-t:#f3edff;--ext-ink:#5b3fa0;--ext-line:#e1d6fb;--chart-a:#b7c0fb;
--side:#0d1130;--side-2:#151a40;--side-ink:#c7cbef;--side-mu:#8a90c0;--side-line:rgba(255,255,255,.07);
--sh-1:0 1px 2px rgba(20,25,70,.05),0 1px 1px rgba(20,25,70,.03);--sh-2:0 2px 4px rgba(20,25,70,.04),0 12px 32px rgba(20,25,70,.08);--sh-3:0 24px 60px rgba(20,25,70,.22);
--r:16px;--r-s:10px;--tabbar-h:64px}
/* ===================== โหมดมืด ===================== */
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0a0d1d;--surface:#131834;--surface-2:#181e3e;--surface-3:#20274c;--ink:#e8eaf8;--muted:#9da3c6;--line:#252c52;--line2:#1d2346;
--pri:#8b8cff;--pri-d:#6d6cf7;--pri-t:rgba(139,140,255,.16);--pri-ink:#b4b5ff;--accent:#22d3ee;
--grad-soft:linear-gradient(135deg,rgba(99,102,241,.22),rgba(217,70,239,.16));
--todo:#a7aec8;--todo-t:rgba(167,174,200,.13);--doing:#7aa7ff;--doing-t:rgba(96,140,255,.16);--review:#fbbf4b;--review-t:rgba(251,191,75,.14);--sign:#c4a5ff;--sign-t:rgba(167,125,255,.16);--done:#34d399;--done-t:rgba(52,211,153,.14);--cancel:#8b90a8;--cancel-t:rgba(139,144,168,.14);
--bad:#fb7185;--bad-t:rgba(251,113,133,.15);--warn:#fbbf4b;--warn-t:rgba(251,191,75,.14);
--a-t:rgba(251,191,75,.13);--a-ink:#fcc75e;--b-t:rgba(96,140,255,.15);--b-ink:#8fb3ff;--c-t:rgba(52,211,153,.13);--c-ink:#4ade9f;
--ext-t:rgba(167,139,250,.14);--ext-ink:#c4b2ff;--ext-line:rgba(167,139,250,.28);--chart-a:#4b56b8;
--side:#070a18;--side-2:#11163a;--side-line:rgba(255,255,255,.06);
--sh-1:0 1px 2px rgba(0,0,0,.3);--sh-2:0 2px 6px rgba(0,0,0,.25),0 14px 36px rgba(0,0,0,.35);--sh-3:0 24px 70px rgba(0,0,0,.6)}

*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Anuphan','IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 500px at 105% -10%,rgba(139,92,246,.13),transparent 60%),radial-gradient(700px 420px at 30% -20%,rgba(14,165,183,.10),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(217,70,239,.07),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri-ink)}
::selection{background:rgba(99,102,241,.25)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.num,.tile .v,.pc .st b,.clock .ct{font-variant-numeric:tabular-nums}

/* ===================== โครงหน้า ===================== */
.layout{display:flex;min-height:100vh;min-height:100dvh}
.side{width:262px;flex:none;background:var(--side);background-image:linear-gradient(180deg,var(--side-2),var(--side) 42%);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.brand{padding:22px 20px 14px;display:flex;align-items:center;gap:12px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(139,92,246,.45);flex:none}
.brand .logo svg{width:22px;height:22px}
.brand .t1{font-size:19px;font-weight:700;color:#fff;letter-spacing:.2px;line-height:1.2}.brand .t2{font-size:11.5px;color:var(--side-mu);line-height:1.35}
.deptsel{margin:6px 14px 10px}
.deptsel select{width:100%;height:42px;border-radius:12px;border:1px solid var(--side-line);background:rgba(255,255,255,.06);color:#fff;padding:0 10px;cursor:pointer}
.deptsel select option,.deptsel select optgroup{background:#151a40;color:#fff}
.deptname{margin:4px 14px 12px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--side-line);font-weight:600;color:#fff;font-size:14px}
.deptname .dv{font-weight:400;font-size:12px;color:var(--side-mu)}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 12px}
.nav .gh{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--side-mu);padding:14px 10px 5px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;text-align:left;background:none;border:0;color:var(--side-ink);padding:10px 12px;border-radius:12px;cursor:pointer;font-size:14.5px;transition:background .15s,color .15s}
.nav button svg{width:19px;height:19px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 8px 20px rgba(124,77,255,.35)}
.nav button.on svg{opacity:1}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.nav .cnt.bad{background:#f43f5e;color:#fff}
.me{margin-top:auto;padding:14px 16px 16px;border-top:1px solid var(--side-line);display:flex;align-items:center;gap:11px}
.me .nm{font-weight:600;color:#fff;font-size:14px}.me .rl{font-size:12px;color:var(--side-mu)}
.me .avbtn{background:none;border:0;padding:0;cursor:pointer;position:relative;flex:none;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.18)}.me .avbtn:hover::after{content:'📷';position:absolute;right:-4px;bottom:-4px;font-size:13px}
.me .lnk{background:none;border:0;color:var(--side-mu);cursor:pointer;font-size:12.5px;padding:2px 0;text-decoration:underline;text-underline-offset:2px}.me .lnk:hover{color:#fff}
.side-tools{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
.side-tools button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:10px;border:1px solid var(--side-line);background:rgba(255,255,255,.05);color:var(--side-ink);cursor:pointer;font-size:13px;white-space:nowrap}
.side-tools button:hover{background:rgba(255,255,255,.1);color:#fff}
.side-tools svg{width:16px;height:16px}
.main{flex:1;min-width:0;padding:26px 32px 56px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
.top h1 .hl{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .sub{color:var(--muted);font-size:14px;margin-top:4px}
.top-r{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.clock{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock .cd{font-size:13.5px;color:var(--muted)}
.clock .ct{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px;font-size:20px;font-weight:700;color:var(--pri-ink);letter-spacing:.5px;box-shadow:var(--sh-1)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh-1);transition:transform .15s}
.icon-btn:hover{transform:translateY(-1px)}.icon-btn svg{width:19px;height:19px}
.appbar,.tabbar,.scrim{display:none}

/* ===================== ปุ่ม / ฟอร์ม ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink);box-shadow:var(--sh-1);transition:transform .12s,box-shadow .15s,background .15s}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(99,102,241,.35)}.btn.pri:hover{box-shadow:0 10px 24px rgba(99,102,241,.45);filter:brightness(1.05)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.f{height:42px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;min-width:0;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.f:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-t)}
select.f{cursor:pointer}
textarea.f{height:auto;min-height:84px;padding:10px 12px;resize:vertical;width:100%}
.search{flex:1 1 220px}
.f.bad{border-color:var(--bad);background:var(--bad-t)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.fld .f{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.inl{display:flex;gap:8px;align-items:center}.inl .f{flex:1}
.pwrow{display:flex;gap:8px;align-items:center}.pwrow .f{flex:1}
.seg{display:inline-flex;background:var(--surface-3);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}

/* ===================== การ์ด / ไทล์ ===================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);overflow:hidden}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.card-h h2{margin:0;font-size:16.5px;font-weight:700}
.card-b{padding:18px 20px}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.tile{position:relative;padding:18px 20px;overflow:hidden;border:1px solid var(--line)}
.tile::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,var(--pri))}
.tile::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c,var(--pri));opacity:.08}
.tile .l{font-size:13.5px;color:var(--muted);font-weight:500}.tile .v{font-size:34px;font-weight:700;line-height:1.15;margin-top:6px;letter-spacing:-.5px}.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.clk{cursor:pointer;transition:transform .15s,box-shadow .15s}.tile.clk:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(20,25,70,.12)}
.mu{color:var(--muted);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{background:var(--pri-t);color:var(--pri-ink);padding:11px 14px;border-radius:12px;font-size:13.5px;line-height:1.6}
.err{background:var(--bad-t);color:var(--bad);padding:11px 14px;border-radius:12px;font-size:14px}
.extb{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;background:var(--ext-t);border:1px solid var(--ext-line);color:var(--ext-ink);border-radius:14px;padding:11px 16px;margin-bottom:18px;font-size:14px}.extb span{font-size:12.5px;opacity:.8}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ext{background:var(--ext-t);color:var(--ext-ink)}
.duehd{display:flex;align-items:center;justify-content:space-between;gap:8px}.nodue{display:inline-flex;align-items:center;gap:5px;font-weight:400;font-size:12.5px;color:var(--muted);cursor:pointer}.nodue input{margin:0;accent-color:var(--pri)}
.dp input:disabled{opacity:.55;cursor:not-allowed}
.pill.otag{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad);font-weight:700}
.obar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 55%,transparent);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}.obar b{font-weight:700}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}.chain .ar{color:var(--muted)}
.fwdbox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border:1px dashed var(--pri);border-radius:12px;padding:10px 14px}
.st-todo{background:var(--todo-t);color:var(--todo)}.st-doing{background:var(--doing-t);color:var(--doing)}.st-review{background:var(--review-t);color:var(--review)}.st-sign{background:var(--sign-t);color:var(--sign)}.st-done{background:var(--done-t);color:var(--done)}.st-cancel{background:var(--cancel-t);color:var(--cancel)}
.pr-urgent{background:var(--bad-t);color:var(--bad)}.pr-high{background:var(--warn-t);color:var(--warn)}.pr-low{background:var(--line2);color:var(--muted)}
.due-bad{background:var(--bad-t);color:var(--bad)}.due-soon{background:var(--warn-t);color:var(--warn)}.due-ok{background:var(--line2);color:var(--muted)}
.av{object-fit:cover;background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:none}
.who{display:inline-flex;align-items:center;gap:7px;font-size:13.5px}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}.bar i{display:block;height:8px;border-radius:99px;background:var(--grad)}
.secttl{font-weight:700;font-size:14px;margin-top:6px;color:var(--ink)}
.workbox{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}

/* ===================== ตาราง ===================== */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;font-size:12.5px;letter-spacing:.2px;color:var(--muted);background:var(--surface-2);padding:11px 14px;white-space:nowrap}
table.t td{padding:12px 14px;border-top:1px solid var(--line2);vertical-align:middle}
table.t tr.clk{cursor:pointer}table.t tr.clk:hover td{background:var(--surface-2)}
table.t td.r,table.t th.r{text-align:right}

/* ===================== บอร์ดงาน ===================== */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:16px;align-items:start;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.col{background:var(--surface-3);border-radius:var(--r);padding:12px;min-height:140px;scroll-snap-align:start;border:1px solid var(--line2)}
.col h3{margin:2px 4px 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh-1);transition:transform .15s,box-shadow .15s,border-color .15s}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:color-mix(in srgb,var(--pri) 35%,var(--line))}
.tcard .tt{font-weight:600;font-size:14px;margin-bottom:4px}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}

/* ===================== บอร์ดทีม (การ์ดคน) ===================== */
.tb{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.otb{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.otb.lead{grid-template-columns:repeat(auto-fill,minmax(220px,250px))}
.pc{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--surface);text-align:center;padding:0 14px 14px;cursor:pointer;box-shadow:var(--sh-1);transition:transform .18s,box-shadow .18s}
.pc:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(20,25,70,.14)}
.pc .bn{position:relative;height:70px;margin:0 -14px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--mc) 42%,var(--surface)),color-mix(in srgb,var(--mc) 10%,var(--surface)))}
.pc .bn::after{content:'';position:absolute;right:-28px;top:-44px;width:130px;height:130px;border-radius:50%;background:color-mix(in srgb,var(--mc) 30%,transparent)}
.pc .bn::before{content:'';position:absolute;left:-20px;bottom:-50px;width:90px;height:90px;border-radius:50%;background:color-mix(in srgb,var(--mc) 18%,transparent)}
.pc .ov{position:absolute;top:10px;left:10px;z-index:2;font-size:11.5px}
.pc .ring{position:relative;z-index:1;width:98px;height:98px;margin:-52px auto 10px;border-radius:50%;padding:3px;background:var(--surface);border:3px solid var(--mc);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px color-mix(in srgb,var(--mc) 35%,transparent)}
.pc .ring .av{width:86px!important;height:86px!important;font-size:34px!important;margin:0}
.pc .nm{font-size:18px;font-weight:700;line-height:1.3}.pc .ps{font-size:12.5px;color:var(--muted);min-height:18px}
.pc .st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 10px}
.pc .st div{border-radius:12px;padding:8px 2px}.pc .st b{display:block;font-size:22px;line-height:1.2}.pc .st span{font-size:11px;color:var(--muted)}
.pc .st .a{background:var(--a-t)}.pc .st .a b{color:var(--a-ink)}.pc .st .b{background:var(--b-t)}.pc .st .b b{color:var(--b-ink)}.pc .st .c{background:var(--c-t)}.pc .st .c b{color:var(--c-ink)}
.pc .nx{font-size:12.5px;color:var(--muted);min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

<body>
<div id="app"><div class="gate"><div class="box"><div class="mu">กำลังโหลด…</div></div></div></div>
<div id="dlg"></div>
<div id="toast"></div>
<script>
(function () {
'use strict';
const CF = window.TD_CONFIG || {};
const sb = window.supabase.createClient(CF.SUPABASE_URL, CF.SUPABASE_ANON_KEY);
const DOMAIN = CF.EMAIL_DOMAIN || 'teamdesk.local';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (m, bad) => { const t = $('toast'); t.textContent = m; t.className = bad ? 'show bad' : 'show'; clearTimeout(toast.h); toast.h = setTimeout(() => { t.className = ''; }, 3800); };
const TWD = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const clockD = () => { const d = new Date(); return 'วัน' + TWD[d.getDay()] + 'ที่ ' + d.getDate() + ' ' + TMF[d.getMonth()] + ' ' + (d.getFullYear() + 543); };
const clockT = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' น.'; };
setInterval(() => { const t = document.getElementById('ck_t'); const sm = document.getElementById('ck_s'); if (sm) sm.textContent = clockT().slice(0, 5); if (t) { t.textContent = clockT(); const dd = document.getElementById('ck_d'); if (dd) dd.textContent = clockD(); } }, 1000);
const TM = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TMF = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const fd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? (+m[3]) + ' ' + TM[+m[2] - 1] + ' ' + String(+m[1] + 543).slice(2) : ''; };
const fdt = s => { if (!s) return ''; const d = new Date(s); return fd(iso(d)) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const days = s => Math.round((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5);
const ST = { todo: ['รอดำเนินการ', 'st-todo'], doing: ['กำลังทำ', 'st-doing'], review: ['รอตรวจ', 'st-review'], sign: ['อยู่ระหว่างเสนอลงนาม', 'st-sign'], done: ['เสร็จแล้ว', 'st-done'], cancel: ['ยกเลิก', 'st-cancel'] };
const PR = { urgent: ['ด่วนมาก', 'pr-urgent'], high: ['ด่วน', 'pr-high'], normal: ['ปกติ', ''], low: ['ไม่เร่ง', 'pr-low'] };
const PAL = ['#1f6f78', '#b5476b', '#6a4fb3', '#c47a15', '#2b6cb0', '#23794e', '#a33a3a', '#4d6b2f', '#7a4e2d', '#3b5b8c'];
const S = { me: null, dept: null, view: 'dash', d: { divisions: [], depts: [], members: [], cats: [], tasks: [], updates: [], docs: [], doclogs: [] }, f: { q: '', who: '', cat: '', st: 'open' }, stat: { y: new Date().getFullYear(), m: 'all' }, dlg: null };
try { S.dept = localStorage.getItem('td_dept') || null; } catch (e) {}

/* ===================== ข้อมูล ===================== */
const TABLES = { divisions: ['td_divisions', 'sort'], depts: ['td_depts', 'sort'], members: ['td_members', 'sort'], cats: ['td_cats', 'sort'], tasks: ['td_tasks', 'created_at'], updates: ['td_updates', 'created_at'], docs: ['td_docs', 'created_at'], doclogs: ['td_doc_logs', 'created_at'] };
async function load(k) {
  let all = [], from = 0;
  for (;;) { const { data, error } = await sb.from(TABLES[k][0]).select('*').order(TABLES[k][1], { ascending: true }).order('id').range(from, from + 999); if (error) { toast('โหลดข้อมูลไม่สำเร็จ: ' + error.message, true); break; } all = all.concat(data || []); if (!data || data.length < 1000) break; from += 1000; }
  S.d[k] = all;
}
const loadAll = () => Promise.all([...Object.keys(TABLES).map(load), sb.rpc('td_ext_ready').then(r => { S.extReady = !r.error && !!r.data; }, () => { S.extReady = false; })]);
const ROLE_TH = { admin: 'ผู้ดูแลระบบ', office: 'หัวหน้าสำนักงาน', division: 'หัวหน้ากอง', head: 'หัวหน้าแผนก', staff: 'เจ้าหน้าที่' };
const isAdmin = () => S.me && S.me.role === 'admin';
const isTop = () => S.me && (S.me.role === 'admin' || S.me.role === 'office');
const isDiv = () => S.me && S.me.role === 'division';
const isLeader = () => isTop() || isDiv();
const deptBy = id => S.d.depts.find(d => d.id === id) || null;
const divBy = id => S.d.divisions.find(v => v.id === id) || null;
// แผนกที่มองเห็นได้ตามบทบาท
const scopeDepts = () => isTop() ? S.d.depts.slice() : isDiv() ? S.d.depts.filter(d => d.division_id === S.me.division_id) : S.d.depts.filter(d => d.id === S.me.dept_id);
const isExt = id => !!(deptBy(id === undefined ? S.dept : id) || {}).ext_source;
const headOf = id => { const d = deptBy(id); return !!d && !d.ext_source && (isTop() || (isDiv() && d.division_id === S.me.division_id) || (S.me.role === 'head' && S.me.dept_id === id)); };
const isHead = () => headOf(S.dept);
const orderedDepts = list => { const ord = d => { const v = divBy(d.division_id); return (v ? v.sort : 0) * 1000 + (d.sort || 0); }; return list.slice().sort((a, b) => ord(a) - ord(b)); };
const dept = () => S.d.depts.find(d => d.id === S.dept) || null;
const members = (all) => S.d.members.filter(m => m.dept_id === S.dept && (all || m.active)).sort((a, b) => (a.role === 'head' ? 0 : 1) - (b.role === 'head' ? 0 : 1) || (a.sort || 0) - (b.sort || 0) || a.nickname.localeCompare(b.nickname, 'th'));
const memberBy = id => S.d.members.find(m => m.id === id) || null;
const mColor = m => m ? (m.color || PAL[(Math.abs([...m.id].reduce((a, c) => a * 31 + c.charCodeAt(0), 7)) % PAL.length)]) : '#9aa7b0';
const av = (m, size) => { const z = size || 26, st = 'width:' + z + 'px;height:' + z + 'px;font-size:' + Math.round(z * .45) + 'px'; return m && m.avatar_url ? '<img class="av" src="' + esc(m.avatar_url) + '" alt="" style="' + st + '" loading="lazy">' : '<span class="av" style="background:' + mColor(m) + ';' + st + '">' + esc(m ? m.nickname.slice(0, 1) : '?') + '</span>'; };
const canManage = m => m && !m.ext_id && (m.id === S.me.id || isAdmin() || (S.me.role === 'office' && m.role !== 'admin') || ((m.role === 'head' || m.role === 'staff') && headOf(m.dept_id)));
const who = m => '<span class="who">' + av(m) + esc(m ? m.nickname : 'ยังไม่มอบหมาย') + '</span>';
const mains = () => S.d.cats.filter(c => c.dept_id === S.dept && !c.parent_id).sort((a, b) => a.sort - b.sort);
const subs = pid => S.d.cats.filter(c => c.parent_id === pid).sort((a, b) => a.sort - b.sort);
const catBy = id => S.d.cats.find(c => c.id === id) || null;
const mainOf = t => { const c = catBy(t.cat_id); return c ? (c.parent_id ? catBy(c.parent_id) : c) : null; };
const catPath = t => { const c = catBy(t.cat_id); if (!c) return ''; const p = c.parent_id ? catBy(c.parent_id) : null; return (p ? p.name + ' › ' : '') + c.name; };
const tasks = () => S.d.tasks.filter(t => t.dept_id === S.dept);
const isOpen = t => t.status !== 'done' && t.status !== 'cancel';
const isOver = t => isOpen(t) && t.due_date && t.due_date < today();

/* ----- รูปโปรไฟล์ (ย่อเป็น 256×256 แล้วอัปโหลดไป Supabase Storage) ----- */
const AV_BUCKET = 'td-avatars';
const avPath = url => { const m = /\/td-avatars\/(.+)$/.exec(String(url || '').split('?')[0]); return m ? decodeURIComponent(m[1]) : null; };
function squareJpeg(file, size) {
  return new Promise((ok, no) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'), s = Math.min(img.width, img.height); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size); URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : no(new Error('แปลงรูปไม่ได้')), 'image/jpeg', 0.85); };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error('ไฟล์นี้ไม่ใช่รูปภาพ')); }; img.src = u; });
}
function avatar(id) {
  const m = memberBy(id); if (!canManage(m)) return toast('ไม่มีสิทธิ์เปลี่ยนรูปของผู้ใช้นี้', true);
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; toast('กำลังอัปโหลดรูป…');
    try {
      const blob = await squareJpeg(f, 256), path = m.id + '/' + Date.now() + '.jpg';
      const up = await sb.storage.from(AV_BUCKET).upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false }); if (up.error) throw up.error;
      const url = sb.storage.from(AV_BUCKET).getPublicUrl(path).data.publicUrl;
      const r = await sb.rpc('td_set_avatar', { p_member: m.id, p_url: url }); if (r.error) throw r.error;
      const old = avPath(m.avatar_url); if (old) sb.storage.from(AV_BUCKET).remove([old]);
      await afterAvatar(m.id); toast('เปลี่ยนรูปโปรไฟล์แล้ว');
    } catch (e) { toast('อัปโหลดรูปไม่สำเร็จ: ' + (e.message || e), true); } };
  inp.click();
}

  const old = avPath(m.avatar_url); if (old) sb.storage.from(AV_BUCKET).remove([old]);
  await afterAvatar(id); toast('ลบรูปแล้ว');
}

function parseCsv(t) {
  t = t.replace(/^\uFEFF/, ''); const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { r.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); rows.push(r); r = []; f = ''; } else f += c; }
  if (f || r.length) { r.push(f); rows.push(r); }
  return rows.filter(x => x.some(v => v.trim()));
}

async function bulkFile(f) {
  if (!f) return; const rows = parseCsv(await f.text()); if (!rows.length) return drawBulk('ไฟล์ว่าง');

  const g = (r, i) => ix[i] < 0 ? '' : (r[ix[i]] || '').trim(), used = new Set(S.d.members.map(m => m.username)), seen = new Set(), out = [];
  const office = (CF.OFFICE_NAME || 'สำนักงาน').trim();
  rows.slice(1).forEach(r => {
    const x = { unit: g(r, 0), roleRaw: g(r, 1), nickname: g(r, 2), full_name: g(r, 3), position: g(r, 4), username: g(r, 5).toLowerCase(), password: g(r, 6) };
    if (!x.nickname && !x.full_name) return; // แถวที่ไม่ได้กรอกชื่อ = ข้าม
    x.role = ROLE_IN[x.roleRaw] || ''; if (!x.password) x.password = genPw();
    if (!x.username) { let b = 'u' + String(out.length + 1).padStart(3, '0'), k = 1; x.username = b; while (used.has(x.username) || seen.has(x.username)) x.username = b + '_' + (++k); }
    if (!x.role) x.err = 'บทบาทไม่ถูกต้อง';
    else if (!x.nickname) x.err = 'ไม่มีชื่อเล่น';

    else if ((x.role === 'head' || x.role === 'staff') && S.d.depts.some(d => d.name.trim() === x.unit && d.ext_source)) x.err = 'แผนกนี้ใช้รายชื่อจาก HR Desk';

    else if (used.has(x.username)) x.err = 'ชื่อผู้ใช้มีในระบบแล้ว';
    else if (seen.has(x.username)) x.err = 'ชื่อผู้ใช้ซ้ำในไฟล์';

    if (x.role === 'office') x.unit = x.unit || office;
    seen.add(x.username); out.push(x);

}

  theme: () => setTheme(theme() === 'dark' ? 'light' : 'dark'), install: installApp, side: on => { const e = $('side'); if (e) e.classList.toggle('open', on); },
  extLink, extUnlink, newDivision, renameDiv, moveDept, newLeader, saveLeader, bulk, bulkTemplate, bulkFile, bulkSave, sumCsv: () => download('บัญชีผู้ใช้_TeamDesk.csv', csv(S.sumRows || [])),
  ndAddWork: () => { grabDept(); S.dlg.works.push({ name: '', subs: ['', '', ''] }); drawDept(); }, ndAddSub: i => { grabDept(); S.dlg.works[i].subs.push(''); drawDept(); }, ndAddMember: () => { grabDept(); S.dlg.team.push({}); drawDept(); },
  copySum: () => { (navigator.clipboard ? navigator.clipboard.writeText(S.sumText) : Promise.reject()).then(() => toast('คัดลอกแล้ว')).catch(() => prompt('คัดลอกข้อความนี้', S.sumText)); },
  expTasks, expStats,
  dpPick: v => { const id = DP.id; if (!id) return; dpSet(id, v); dpClose(); }, dpNav: k => { DP.m += k; if (DP.m < 0) { DP.m = 11; DP.y--; } if (DP.m > 11) { DP.m = 0; DP.y++; } dpDraw(); },
  logout: async () => { await sb.auth.signOut(); location.reload(); }
};
Object.assign(window.TD, DOCS_API);
// ปุ่มยกเลิกในหน้าแก้ไขงาน → กลับไปหน้ารายละเอียดงาน
const _open = openTask; window.TD.openTask = id => { if (S.dlg) S.dlg.editing = false; _open(id); };

if (!CF.SUPABASE_URL || !CF.SUPABASE_ANON_KEY) { $('app').innerHTML = '<div class="gate"><div class="box"><div class="glogo">' + ico('logo') + '</div><h1>Team Desk</h1><div class="err">ไม่พบ config.js หรือยังไม่ได้ใส่ SUPABASE_URL / SUPABASE_ANON_KEY</div></div></div>'; return; }
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { S.me = null; gate('login'); } });
start();
})();
</script>
