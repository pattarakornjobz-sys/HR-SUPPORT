<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ · บอร์ดงานแผนกบุคคลและสวัสดิการ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand-mark" style="width:52px;height:52px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><circle cx="8" cy="14" r="1.2" fill="#fff" stroke="none"/><circle cx="12" cy="14" r="1.2" fill="#fff" stroke="none"/><circle cx="16" cy="14" r="1.2" fill="#fff" stroke="none"/></svg>
    </div>
    <h1>บอร์ดงานแผนกบุคคลและสวัสดิการ</h1>
    <div class="sub">มูลนิธิส่งเสริมศิลปาชีพฯ</div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">อีเมล</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-submit" id="submit-btn">เข้าสู่ระบบ</button>
    </form>

    <div class="login-foot">บัญชีสร้างโดยหัวหน้าแผนกผ่าน Supabase Authentication</div>
  </div>
</div>

<script>
  const sb = window.supabase.createClient(window.HR_CONFIG.SUPABASE_URL, window.HR_CONFIG.SUPABASE_ANON_KEY);

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.replace('index.html');
  })();

  const form = document.getElementById('login-form');
  const errBox = document.getElementById('login-error');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'กำลังเข้าสู่ระบบ…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      errBox.textContent = 'เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง';
      errBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
      return;
    }
    window.location.replace('index.html');
  });
</script>
</body>
</html>
