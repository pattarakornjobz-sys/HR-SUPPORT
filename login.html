    <div class="logo" style="margin:0 auto 14px">HR</div>
    <div class="eyebrow">แผนกบุคคลและสวัสดิการ · มูลนิธิ</div>
    <h1 style="margin:2px 0 4px;font-size:24px">HR Desk</h1>
    <div class="mu" style="margin-bottom:22px">เข้าสู่ระบบด้วย Gmail ที่หัวหน้าแผนกเพิ่มไว้</div>
    <div id="err" class="warn bad" style="display:none;text-align:left"></div>
    <button id="go" class="btn" style="width:100%;padding:12px;font-size:14.5px;color:var(--ink)">เข้าสู่ระบบด้วย Google</button>
    <div class="mu" style="margin-top:18px">ข้อมูลภายในแผนกเท่านั้น</div>
  </div>
</div>
<script>
  const sb = supabase.createClient(window.HR_CONFIG.SUPABASE_URL, window.HR_CONFIG.SUPABASE_ANON_KEY);
  const qp = new URLSearchParams(location.search), err = qp.get('error_description') || qp.get('error');
  if (err) { const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = err; }
  sb.auth.getSession().then(({ data }) => { if (data.session) location.replace('index.html'); });
  document.getElementById('go').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/index.html' } });
</script>
</body>
</html>
