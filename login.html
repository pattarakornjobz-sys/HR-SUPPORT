<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ · บอร์ดงานแผนกบุคคลและสวัสดิการ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand-mark" style="width:52px;height:52px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><circle cx="8" cy="14" r="1.2" fill="#fff" stroke="none"/><circle cx="12" cy="14" r="1.2" fill="#fff" stroke="none"/><circle cx="16" cy="14" r="1.2" fill="#fff" stroke="none"/></svg>
    </div>
    <h1>บอร์ดงานแผนกบุคคลและสวัสดิการ</h1>
    <div class="sub">มูลนิธิส่งเสริมศิลปาชีพฯ</div>

    <div class="login-error" id="login-error"></div>

    <button type="button" class="google-btn" id="google-btn">
      <svg viewBox="0 0 48 48" width="18" height="18">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.4 0 10.3-1.9 14.1-5.2l-6.5-5.5C29.5 34.9 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 2.8-2.8 5.1-5.2 6.7l6.5 5.5C40.1 37.4 44 31.4 44 24c0-1.3-.1-2.7-.4-3.5z"/>
      </svg>
      เข้าสู่ระบบด้วย Gmail
    </button>

    <div class="login-foot">ต้องเป็นบัญชี Gmail ที่หัวหน้าแผนกอนุมัติไว้เท่านั้น</div>
  </div>
</div>

<script>
  const sb = window.supabase.createClient(window.HR_CONFIG.SUPABASE_URL, window.HR_CONFIG.SUPABASE_ANON_KEY);

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.replace('index.html');
  })();

  const errBox = document.getElementById('login-error');
  const params = new URLSearchParams(window.location.search);
  if (params.get('error')) {
    errBox.textContent = 'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
    errBox.classList.add('show');
  }

  document.getElementById('google-btn').addEventListener('click', async () => {
    await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/index.html' },
    });
  });
</script>
</body>
</html>
